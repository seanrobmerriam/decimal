<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decimal Money Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
        }

        .calculator-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .calculator-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .calculator-header p {
            font-size: 0.875rem;
            opacity: 0.9;
        }

        .calculator-body {
            padding: 24px;
        }

        .currency-selector {
            margin-bottom: 20px;
        }

        .currency-selector label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .currency-selector select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .currency-selector select:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1.25rem;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group input::placeholder {
            color: #9ca3af;
        }

        .operations {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .operation-btn {
            padding: 16px 8px;
            border: none;
            border-radius: 8px;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: #f3f4f6;
            color: #374151;
        }

        .operation-btn:hover {
            background: #e5e7eb;
        }

        .operation-btn.active {
            background: #667eea;
            color: white;
        }

        .calculate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(102, 126, 234, 0.5);
        }

        .calculate-btn:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 2rem;
            font-weight: 700;
            color: #1f2937;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
        }

        .error {
            margin-top: 12px;
            padding: 12px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #dc2626;
            font-size: 0.875rem;
            text-align: left;
            display: none;
        }

        .error.show {
            display: block;
        }

        .history {
            margin-top: 20px;
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }

        .history-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        .history-list {
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            padding: 8px 12px;
            background: #f9fafb;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.875rem;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
        }

        .history-item:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="calculator-header">
            <h1>Decimal Money Calculator</h1>
            <p>Precise Financial Arithmetic</p>
        </div>
        
        <div class="calculator-body">
            <div class="currency-selector">
                <label for="currency">Currency</label>
                <select id="currency">
                    <option value="USD">USD - US Dollar</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP">GBP - British Pound</option>
                    <option value="JPY">JPY - Japanese Yen</option>
                    <option value="CHF">CHF - Swiss Franc</option>
                    <option value="CAD">CAD - Canadian Dollar</option>
                    <option value="AUD">AUD - Australian Dollar</option>
                    <option value="CNY">CNY - Chinese Yuan</option>
                    <option value="INR">INR - Indian Rupee</option>
                    <option value="BRL">BRL - Brazilian Real</option>
                    <option value="MXN">MXN - Mexican Peso</option>
                    <option value="KRW">KRW - South Korean Won</option>
                    <option value="SGD">SGD - Singapore Dollar</option>
                    <option value="HKD">HKD - Hong Kong Dollar</option>
                    <option value="NOK">NOK - Norwegian Krone</option>
                    <option value="SEK">SEK - Swedish Krona</option>
                    <option value="DKK">DKK - Danish Krone</option>
                    <option value="NZD">NZD - New Zealand Dollar</option>
                    <option value="ZAR">ZAR - South African Rand</option>
                </select>
            </div>

            <div class="input-group">
                <label for="amount1">First Amount</label>
                <input type="text" id="amount1" placeholder="0.00" value="100.00">
            </div>

            <div class="operations">
                <button class="operation-btn active" data-op="add">+</button>
                <button class="operation-btn" data-op="sub">−</button>
                <button class="operation-btn" data-op="mul">×</button>
                <button class="operation-btn" data-op="div">÷</button>
            </div>

            <div class="input-group">
                <label for="amount2">Second Amount / Factor</label>
                <input type="text" id="amount2" placeholder="0.00" value="25.50">
            </div>

            <button class="calculate-btn" id="calculate">Calculate</button>

            <div class="result" id="result">
                <div class="result-label">Result</div>
                <div class="result-value" id="result-value">$0.00</div>
            </div>

            <div class="error" id="error"></div>

            <div class="history" id="history-section" style="display: none;">
                <div class="history-title">History</div>
                <div class="history-list" id="history-list"></div>
            </div>
        </div>
    </div>

    <script type="module">
        // Pure JavaScript implementation of the Money library for the web
        // This mirrors the API of the TypeScript library

        const CurrencyCode = {
            USD: { code: "USD", exponent: 2, name: "United States Dollar" },
            EUR: { code: "EUR", exponent: 2, name: "Euro" },
            GBP: { code: "GBP", exponent: 2, name: "British Pound Sterling" },
            JPY: { code: "JPY", exponent: 0, name: "Japanese Yen" },
            CHF: { code: "CHF", exponent: 2, name: "Swiss Franc" },
            CAD: { code: "CAD", exponent: 2, name: "Canadian Dollar" },
            AUD: { code: "AUD", exponent: 2, name: "Australian Dollar" },
            CNY: { code: "CNY", exponent: 2, name: "Chinese Yuan" },
            INR: { code: "INR", exponent: 2, name: "Indian Rupee" },
            BRL: { code: "BRL", exponent: 2, name: "Brazilian Real" },
            MXN: { code: "MXN", exponent: 2, name: "Mexican Peso" },
            KRW: { code: "KRW", exponent: 0, name: "South Korean Won" },
            SGD: { code: "SGD", exponent: 2, name: "Singapore Dollar" },
            HKD: { code: "HKD", exponent: 2, name: "Hong Kong Dollar" },
            NOK: { code: "NOK", exponent: 2, name: "Norwegian Krone" },
            SEK: { code: "SEK", exponent: 2, name: "Swedish Krona" },
            DKK: { code: "DKK", exponent: 2, name: "Danish Krone" },
            NZD: { code: "NZD", exponent: 2, name: "New Zealand Dollar" },
            ZAR: { code: "ZAR", exponent: 2, name: "South African Rand" },
        };

        const RoundingMode = {
            Up: "UP",
            Down: "DOWN",
            HalfUp: "HALF_UP",
            HalfDown: "HALF_DOWN",
            HalfEven: "HALF_EVEN",
            Ceiling: "CEILING",
            Floor: "FLOOR"
        };

        class Currency {
            constructor(code, exponent, name) {
                this.code = code;
                this.exponent = exponent;
                this.name = name;
            }

            static fromCode(code) {
                const c = CurrencyCode[code.toUpperCase()];
                if (c) {
                    return new Currency(c.code, c.exponent, c.name);
                }
                return undefined;
            }
        }

        class Decimal {
            constructor(value, scale) {
                this.value = value;
                this.scale = scale;
            }

            static fromString(s) {
                s = s.trim();
                if (!s) {
                    throw new Error("parse error: empty string");
                }

                const negative = s.startsWith('-');
                s = s.replace(/^[+-]/, '');

                const parts = s.split('.');
                const intPart = parts[0] || "0";
                const fracPart = parts[1] || "";

                if (!/^\d+$/.test(intPart) || !/^\d*$/.test(fracPart)) {
                    throw new Error("parse error: invalid character");
                }

                const combined = intPart + fracPart;
                let value = BigInt(combined);
                if (negative) {
                    value = -value;
                }

                return new Decimal(value, fracPart.length);
            }

            getValue() { return this.value; }
            getScale() { return this.scale; }
            isZero() { return this.value === 0n; }
            isPositive() { return this.value > 0n; }
            isNegative() { return this.value < 0n; }

            add(other) {
                const scale = Math.max(this.scale, other.scale);
                const scaledThis = this.scaleTo(scale);
                const scaledOther = other.scaleTo(scale);
                return new Decimal(scaledThis.value + scaledOther.value, scale);
            }

            sub(other) {
                return this.add(other.neg());
            }

            mul(other) {
                return new Decimal(this.value * other.value, this.scale + other.scale);
            }

            div(other, rounding = RoundingMode.HalfEven) {
                if (other.value === 0n) {
                    throw new Error("division by zero");
                }

                const extraScale = 10;
                const scaledValue = this.value * 10n ** BigInt(extraScale);
                let quo = scaledValue / other.value;
                const rem = scaledValue % other.value;

                if (rem !== 0n) {
                    const absRem = rem < 0n ? -rem : rem;
                    const absDiv = other.value < 0n ? -other.value : other.value;
                    const twoRem = absRem * 2n;

                    let needsInc = false;
                    switch (rounding) {
                        case RoundingMode.Up:
                            needsInc = true;
                            break;
                        case RoundingMode.Down:
                            needsInc = false;
                            break;
                        case RoundingMode.HalfUp:
                            needsInc = twoRem >= absDiv;
                            break;
                        case RoundingMode.HalfDown:
                            needsInc = twoRem > absDiv;
                            break;
                        case RoundingMode.HalfEven:
                            needsInc = twoRem > absDiv || (twoRem === absDiv && (quo < 0n ? -quo : quo) % 2n !== 0n);
                            break;
                        case RoundingMode.Ceiling:
                            needsInc = quo >= 0n;
                            break;
                        case RoundingMode.Floor:
                            needsInc = quo < 0n;
                            break;
                    }

                    if (needsInc) {
                        quo += quo >= 0n ? 1n : -1n;
                    }
                }

                const scaleDivisor = 10n ** BigInt(extraScale);
                quo = quo / scaleDivisor;

                return new Decimal(quo, this.scale);
            }

            neg() {
                return new Decimal(-this.value, this.scale);
            }

            scaleTo(targetScale) {
                if (targetScale <= this.scale) {
                    return this;
                }
                const diff = targetScale - this.scale;
                return new Decimal(this.value * 10n ** BigInt(diff), targetScale);
            }

            toString() {
                const absValue = this.value < 0n ? -this.value : this.value;
                let s = absValue.toString();

                if (this.scale > 0) {
                    if (s.length <= this.scale) {
                        s = '0'.repeat(this.scale - s.length + 1) + s;
                    }
                    const pos = s.length - this.scale;
                    s = s.slice(0, pos) + '.' + s.slice(pos);
                }

                return (this.value < 0n ? '-' : '') + s;
            }
        }

        class Money {
            constructor(amount, currency) {
                this.amount = amount;
                this.currency = currency;
            }

            static fromInt(currencyCode, amount) {
                const currency = Currency.fromCode(currencyCode);
                if (!currency) {
                    throw new Error(`unknown currency: ${currencyCode}`);
                }
                return new Money(BigInt(amount), currency);
            }

            static fromString(currencyCode, s) {
                const currency = Currency.fromCode(currencyCode);
                if (!currency) {
                    throw new Error(`unknown currency: ${currencyCode}`);
                }

                s = s.trim();
                const negative = s.startsWith('-');
                s = s.replace(/^[+-]/, '');

                const parts = s.split('.');
                const intPart = parts[0] || "0";
                const fracPart = parts[1] || "";

                if (!/^\d+$/.test(intPart) || !/^\d*$/.test(fracPart)) {
                    throw new Error("parse error: invalid character");
                }

                let frac = fracPart;
                while (frac.length < currency.exponent) {
                    frac += '0';
                }
                if (frac.length > currency.exponent) {
                    frac = frac.slice(0, currency.exponent);
                }

                const combined = intPart + frac;
                let value = BigInt(combined);
                if (negative) {
                    value = -value;
                }

                return new Money(value, currency);
            }

            getAmount() { return this.amount; }
            getCurrency() { return this.currency; }
            isZero() { return this.amount === 0n; }
            isPositive() { return this.amount > 0n; }
            isNegative() { return this.amount < 0n; }

            add(other) {
                if (this.currency.code !== other.currency.code) {
                    throw new Error(`currency mismatch: cannot add ${this.currency.code} and ${other.currency.code}`);
                }
                const result = this.amount + other.amount;
                return new Money(result, this.currency);
            }

            sub(other) {
                if (this.currency.code !== other.currency.code) {
                    throw new Error(`currency mismatch: cannot subtract ${this.currency.code} and ${other.currency.code}`);
                }
                const result = this.amount - other.amount;
                return new Money(result, this.currency);
            }

            mul(factor) {
                const product = this.amount * factor.getValue();
                const scale = factor.getScale();

                if (scale > 0) {
                    const divisor = 10n ** BigInt(scale);
                    let quo = product / divisor;
                    const rem = product % divisor;

                    if (rem !== 0n) {
                        const absRem = rem < 0n ? -rem : rem;
                        const absDiv = divisor;
                        const twoRem = absRem * 2n;

                        const needsInc = twoRem >= absDiv;
                        if (needsInc) {
                            quo += product > 0n ? 1n : -1n;
                        }
                    }

                    return new Money(quo, this.currency);
                }

                return new Money(product, this.currency);
            }

            div(divisor, rounding = RoundingMode.HalfEven) {
                if (divisor.getValue() === 0n) {
                    throw new Error("division by zero");
                }

                const extraScale = 4;
                const scaled = this.amount * 10n ** BigInt(extraScale);
                let quo = scaled / divisor.getValue();
                const rem = scaled % divisor.getValue();

                if (rem !== 0n) {
                    const absRem = rem < 0n ? -rem : rem;
                    const absDiv = divisor.getValue() < 0n ? -divisor.getValue() : divisor.getValue();
                    const twoRem = absRem * 2n;

                    let needsInc = false;
                    switch (rounding) {
                        case RoundingMode.Up:
                            needsInc = true;
                            break;
                        case RoundingMode.Down:
                            needsInc = false;
                            break;
                        case RoundingMode.HalfUp:
                            needsInc = twoRem >= absDiv;
                            break;
                        case RoundingMode.HalfDown:
                            needsInc = twoRem > absDiv;
                            break;
                        case RoundingMode.HalfEven:
                            needsInc = twoRem > absDiv || (twoRem === absDiv && (quo < 0n ? -quo : quo) % 2n !== 0n);
                            break;
                        case RoundingMode.Ceiling:
                            needsInc = quo >= 0n;
                            break;
                        case RoundingMode.Floor:
                            needsInc = quo < 0n;
                            break;
                    }

                    if (needsInc) {
                        quo += quo >= 0n ? 1n : -1n;
                    }
                }

                const scaleDivisor = 10n ** BigInt(extraScale);
                quo = quo / scaleDivisor;

                return new Money(quo, this.currency);
            }

            format() {
                const exp = this.currency.exponent;
                const symbol = this.currency.code;
                const absAmount = this.amount < 0n ? -this.amount : this.amount;
                let amountStr = absAmount.toString();

                if (exp > 0) {
                    if (amountStr.length <= exp) {
                        amountStr = '0'.repeat(exp - amountStr.length + 1) + amountStr;
                    }
                    const pointPos = amountStr.length - exp;
                    amountStr = amountStr.slice(0, pointPos) + '.' + amountStr.slice(pointPos);
                }

                if (this.amount < 0n) {
                    amountStr = '-' + amountStr;
                }

                return symbol + ' ' + amountStr;
            }
        }

        // UI Logic
        let currentOperation = 'add';
        let history = [];

        const currencySelect = document.getElementById('currency');
        const amount1Input = document.getElementById('amount1');
        const amount2Input = document.getElementById('amount2');
        const operationBtns = document.querySelectorAll('.operation-btn');
        const calculateBtn = document.getElementById('calculate');
        const resultDiv = document.getElementById('result');
        const resultValue = document.getElementById('result-value');
        const errorDiv = document.getElementById('error');
        const historySection = document.getElementById('history-section');
        const historyList = document.getElementById('history-list');

        // Operation button handling
        operationBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                operationBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentOperation = btn.dataset.op;
            });
        });

        // Calculate button handling
        calculateBtn.addEventListener('click', () => {
            try {
                const currencyCode = currencySelect.value;
                const a = Money.fromString(currencyCode, amount1Input.value);
                const b = Money.fromString(currencyCode, amount2Input.value);
                
                let result;
                switch (currentOperation) {
                    case 'add':
                        result = a.add(b);
                        break;
                    case 'sub':
                        result = a.sub(b);
                        break;
                    case 'mul':
                        // For multiply, second value is treated as decimal factor
                        const factor = Decimal.fromString(amount2Input.value);
                        result = a.mul(factor);
                        break;
                    case 'div':
                        // For divide, second value is treated as decimal divisor
                        const divisor = Decimal.fromString(amount2Input.value);
                        result = a.div(divisor);
                        break;
                }

                resultValue.textContent = result.format();
                resultDiv.classList.add('show');
                errorDiv.classList.remove('show');

                // Add to history
                const opSymbol = { add: '+', sub: '−', mul: '×', div: '÷' }[currentOperation];
                const historyItem = `${a.format()} ${opSymbol} ${b.format()} = ${result.format()}`;
                history.unshift(historyItem);
                if (history.length > 10) history.pop();
                
                historyList.innerHTML = history.map(item => 
                    `<div class="history-item">${item}</div>`
                ).join('');
                historySection.style.display = 'block';

            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.add('show');
                resultDiv.classList.remove('show');
            }
        });

        // Enter key handling
        [amount1Input, amount2Input].forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    calculateBtn.click();
                }
            });
        });
    </script>
</body>
</html>
